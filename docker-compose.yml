version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youngin_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./youngin_apparels.db
      - ADMIN_API_KEY=youngin-secret-admin-key-2026
    volumes:
      - ./backend/youngin_apparels.db:/app/youngin_apparels.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: youngin_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
